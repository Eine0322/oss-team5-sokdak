name: "🎯 BE Feature"
description: "BE 새로운 기능 추가"
title: "[BE] "
labels: ["Backend"]

body:
  - type: textarea
    attributes:
      label: "📄 설명"
      description: "추가할 백엔드 기능과 기대 동작을 작성해 주세요."
      placeholder: "예시) 프로젝트 참여 API를 추가하고, 닉네임 중복과 정원 초과를 검사합니다."
    validations:
      required: false

  - type: textarea
    attributes:
      label: "✅ 작업 목록"
      description: "구현할 작업을 적고, 필요한 경우 서브 이슈로 나눠 주세요."
      placeholder: |
        - [ ] [BE] feat : API 라우트 구현
        - [ ] [BE] refactor : 요청 검증 및 예외 처리
        - [ ] [BE] test : 테스트 작성
    validations:
      required: false
